<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:28px 32px;background:var(--color-paper);color:var(--color-ink);font-family:var(--font-sans);font-size:13px;line-height:20px">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px"><div style="display:grid;gap:8px"><div style="height:72px;background:var(--color-paper);border:1px solid var(--color-line)"></div><div>Paper</div><div style="color:var(--color-muted);font-family:ui-monospace,monospace;font-size:11px">--color-paper<br>#fcfcfa</div></div><div style="display:grid;gap:8px"><div style="height:72px;background:var(--color-ink);border:1px solid var(--color-line)"></div><div>Ink</div><div style="color:var(--color-muted);font-family:ui-monospace,monospace;font-size:11px">--color-ink<br>#161616</div></div><div style="display:grid;gap:8px"><div style="height:72px;background:var(--color-muted);border:1px solid var(--color-line)"></div><div>Muted</div><div style="color:var(--color-muted);font-family:ui-monospace,monospace;font-size:11px">--color-muted<br>#75726c</div></div><div style="display:grid;gap:8px"><div style="height:72px;background:var(--color-line);border:1px solid var(--color-line)"></div><div>Line</div><div style="color:var(--color-muted);font-family:ui-monospace,monospace;font-size:11px">--color-line<br>#e8e6e1</div></div></div>
</body></html>
