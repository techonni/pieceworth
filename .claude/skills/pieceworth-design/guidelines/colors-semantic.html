<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:28px 32px;background:var(--color-paper);color:var(--color-ink);font-family:var(--font-sans);font-size:13px;line-height:20px">
<div style="display:grid;gap:0;border-top:1px solid var(--color-line)"><div style="display:flex;gap:16px;align-items:center;padding:6px 0;border-bottom:1px solid var(--color-line)"><span style="width:28px;height:16px;background:var(--surface-page);border:1px solid var(--color-line)"></span><code style="width:170px;font-size:11px">--surface-page</code><span style="color:var(--color-muted)">Page background (Paper)</span></div><div style="display:flex;gap:16px;align-items:center;padding:6px 0;border-bottom:1px solid var(--color-line)"><span style="width:28px;height:16px;background:var(--surface-image);border:1px solid var(--color-line)"></span><code style="width:170px;font-size:11px">--surface-image</code><span style="color:var(--color-muted)">Product image wells (#fff)</span></div><div style="display:flex;gap:16px;align-items:center;padding:6px 0;border-bottom:1px solid var(--color-line)"><span style="width:28px;height:16px;background:var(--text-primary);border:1px solid var(--color-line)"></span><code style="width:170px;font-size:11px">--text-primary</code><span style="color:var(--color-muted)">Headings, body, links (Ink)</span></div><div style="display:flex;gap:16px;align-items:center;padding:6px 0;border-bottom:1px solid var(--color-line)"><span style="width:28px;height:16px;background:var(--text-secondary);border:1px solid var(--color-line)"></span><code style="width:170px;font-size:11px">--text-secondary</code><span style="color:var(--color-muted)">Summaries, nav, meta (Muted)</span></div><div style="display:flex;gap:16px;align-items:center;padding:6px 0;border-bottom:1px solid var(--color-line)"><span style="width:28px;height:16px;background:var(--border-hairline);border:1px solid var(--color-line)"></span><code style="width:170px;font-size:11px">--border-hairline</code><span style="color:var(--color-muted)">1px dividers (Line)</span></div><div style="display:flex;gap:16px;align-items:center;padding:6px 0;border-bottom:1px solid var(--color-line)"><span style="width:28px;height:16px;background:var(--border-strong);border:1px solid var(--color-line)"></span><code style="width:170px;font-size:11px">--border-strong</code><span style="color:var(--color-muted)">Link underline, verdict rule (Ink)</span></div></div>
</body></html>
